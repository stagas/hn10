name: Test and deploy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: bun run check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: hn10-production
      cancel-in-progress: false
    env:
      SSH_TARGET: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hn10_deploy_key

      - name: Upload application
        shell: bash
        run: |
          rsync --archive --compress --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'node_modules/' \
            -e "ssh -i ~/.ssh/hn10_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            ./ "$SSH_TARGET:apps/hn10/"

      - name: Install production dependencies and restart hn10
        shell: bash
        run: |
          ssh -i ~/.ssh/hn10_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_TARGET" \
            'cd apps/hn10 && "$HOME/.bun/bin/bun" install --production --frozen-lockfile && systemctl --user restart hn10'
